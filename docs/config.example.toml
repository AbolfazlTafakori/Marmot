# Marmot node configuration — schema v1 (draft)
# Addresses below are documentation ranges (RFC 5737 / RFC 3849); replace them.

[node]
id = "iran-gateway-01"
role = "hybrid"                       # relay | exit | hybrid
identity_key_file = "/etc/marmot/identity.key"   # generated by `marmot keygen`

# ---------------------------------------------------------------
# Port steering: only these ports are bound. Everything else is
# untouched (implicit bypass). SSH and the API port are refused here.
# ---------------------------------------------------------------
# Example: a user config on port 2022 is NOT listed, so it bypasses Marmot.
[steering]
tunneled_ports = [443, 8443, 2052, 2057]
vip_control_ports = [62050, 2053]
protocols = ["tcp", "udp"]            # default for every port

# Optional: per-port overrides
[steering.port_map]                   # user port -> target port on receiving node
2052 = 12052                          # default: same port
[steering.port_protocols]
2057 = ["udp"]                        # e.g. a Hysteria2 inbound

# Inter-node listeners (hidden from users; must not collide with user ports)
[[transport_listen]]
transport = "tls"
port = 9443
[[transport_listen]]
transport = "ws"
port = 2083
options = { path = "/ws" }            # tls, cert_file, key_file, sni as for tls
[[transport_listen]]
transport = "quic"
port_range = "40000-50000"

# ---------------------------------------------------------------
# Panel integration (relay mode, applied on the receiving node)
# ---------------------------------------------------------------
[panel_integration]
preserve_client_ip = "proxy_v2"       # none | proxy_v2
skip_double_encryption = true         # inner TLS/Reality: auth headers only

# Exit mode: local SOCKS5 for a panel running on this node
[socks5]
enabled = false
listen = "127.0.0.1:1080"

# ---------------------------------------------------------------
# Local addresses used to originate paths
# ---------------------------------------------------------------
[local]
ipv4_pool = ["192.0.2.10", "192.0.2.11"]
ipv6_subnet = "2001:db8:1::/64"       # must be routed to this host
ipv6_rotation = { enabled = true, epoch = "5m", active = 4 }

# ---------------------------------------------------------------
# Session behaviour
# ---------------------------------------------------------------
[session]
rotate_bytes = "25MiB"
rotate_interval = "10m"
standby_paths = 2                     # v1: hot-standby count per peer

[fec]
mode = "adaptive"                     # off | fixed | adaptive
data_shards = 4
max_parity_shards = 3

[relay]
allow_transit = true                  # this node may relay for others
max_hops = 2

# ---------------------------------------------------------------
# Peers
# ---------------------------------------------------------------
[[peers]]
id = "kharej-germany-01"
public_key = "ed25519:BASE64PUBLICKEY..."
weight = 5
ipv4_pool = ["198.51.100.1", "198.51.100.2"]
ipv6_pool = ["2001:db8:2::10"]          # IPv6 addresses the peer listens on
ipv6_subnet = "2001:db8:2::/64"         # Phase 4: rotating addresses

  [[peers.endpoints]]
  transport = "tls"
  ports = [9443, 2083]               # must not collide with panel inbounds on that server
  # direction = "outbound"            # Phase 4: outbound | inbound | both
  options = { sni = "example.com", fingerprint = "chrome" }

  [[peers.endpoints]]
  transport = "ws"
  ports = [443]
  # direction = "inbound"             # Phase 4: peer dials us (reverse)
  # ws options: path (default "/"), host (Host header), tls (default true),
  # sni, fingerprint. tls = false suits a CDN that terminates TLS for us.
  options = { path = "/ws", sni = "cdn.example.com" }

  [[peers.endpoints]]
  transport = "quic"
  port_range = "40000-50000"
  hop_interval = "30s"
  family = "ipv6"

[[peers]]
id = "kharej-finland-02"
public_key = "ed25519:BASE64PUBLICKEY..."
weight = 3
ipv4_pool = ["203.0.113.5"]

  [[peers.endpoints]]
  transport = "grpc"
  ports = [443]
  # grpc options: service (default "marmot.Tunnel"; calls /<service>/Tun),
  # host (:authority), tls (default true), sni, fingerprint.
  options = { service = "api.v1.Sync", sni = "cdn.example.com" }
  # direction = "outbound"            # Phase 4

# ---------------------------------------------------------------
# Control plane
# ---------------------------------------------------------------
[api]
listen = "0.0.0.0:7443"
tls_cert = "/etc/marmot/panel.crt"
tls_key = "/etc/marmot/panel.key"
allow_ips = []                        # empty = any
data_dir = "/var/lib/marmot"

[telemetry]
log_level = "info"
metrics_listen = "127.0.0.1:9100"
