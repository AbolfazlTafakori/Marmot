# One Marmot node. See docs/deploy.md for the first start.
services:
  marmot:
    image: marmot:latest
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # Host networking: user ports and inter-node ports are bound on the
    # host directly, with no Docker NAT on the data path (ARCHITECTURE §17).
    network_mode: host
    cap_drop: [ALL]
    cap_add:
      - NET_BIND_SERVICE # ports below 1024, such as 443
      - NET_ADMIN # socket options for multi-IP paths
    read_only: true
    security_opt: [no-new-privileges:true]
    volumes:
      - ./etc:/etc/marmot # marmot.toml and identity.key, writable by uid 65532
      - ./data:/var/lib/marmot # panel database
    # GOMEMLIMIT is derived from this limit automatically.
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options: { max-size: 20m, max-file: '5' }
